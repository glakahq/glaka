<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Glaka{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f6f3; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --border: #e2e1dc; --accent: #2f5d50; --accent-text: #ffffff;
      --ok-bg: #e4f1ea; --ok: #1f6b45; --warn-bg: #fbefd9; --warn: #8a5a00;
      --bad-bg: #f8e3e1; --bad: #9b2c22; --info-bg: #e6eef8; --info: #2a5885;
      --quote: #f1f0ec; --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --surface: #1f1f1d; --text: #ecebe6; --muted: #9c9b95;
        --border: #34332f; --accent: #6fb39c; --accent-text: #10201b;
        --ok-bg: #18342a; --ok: #8fd4b0; --warn-bg: #3a2d14; --warn: #f0c46e;
        --bad-bg: #3d1e1b; --bad: #f2a097; --info-bg: #1b2a3b; --info: #9cc3ec;
        --quote: #262623;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
    header .brand { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); }
    header .tag { color: var(--muted); font-size: 13px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 28px 0 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
    .ok { background: var(--ok-bg); color: var(--ok); }
    .warn { background: var(--warn-bg); color: var(--warn); }
    .bad { background: var(--bad-bg); color: var(--bad); }
    .info { background: var(--info-bg); color: var(--info); }
    .quote { background: var(--quote); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; margin: 8px 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    textarea { min-height: 96px; resize: vertical; }
    button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); }
    button.secondary { background: transparent; color: var(--bad); border-color: var(--border); }
    button:disabled { opacity: .6; cursor: wait; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .spread { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .alert { background: var(--bad-bg); color: var(--bad); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
    .dev-note { font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 2px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/ui">Glaka</a>
    <span class="tag">AI front desk</span>
    {% block header_extra %}{% endblock %}
    <span style="flex:1"></span>
    <span class="dev-note">Dev UI, no login</span>
    <a href="/docs" class="muted">API docs</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    // Drafting takes a few seconds: show it, and stop double submits.
    document.querySelectorAll("form[data-busy]").forEach(f => f.addEventListener("submit", e => {
      const b = e.submitter || f.querySelector("button");
      f.querySelectorAll("button").forEach(x => x.disabled = true);
      if (b) b.textContent = f.dataset.busy;
      if (e.submitter && e.submitter.name) {  // disabled buttons aren't submitted; keep the value
        const h = document.createElement("input");
        h.type = "hidden"; h.name = e.submitter.name; h.value = e.submitter.value; f.appendChild(h);
      }
    }));
  </script>
</body>
</html>
