{% extends "base.html" %}
{% block title %}Sign in · Glaka{% endblock %}
{% block content %}
  <div style="max-width:380px;margin:40px auto">
    <h1>Sign in</h1>
    <form class="card" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="row"><button>Sign in</button></div>
    </form>
    <p class="muted">Accounts are created by an admin:
      <code>uv run python -m glaka.cli create-user</code></p>
  </div>
{% endblock %}
